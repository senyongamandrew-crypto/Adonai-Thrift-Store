services:
  # Web Service: Adonai Thrift Store (Next.js 16 + PostgreSQL)
  - type: web
    name: adonai-thrift-store
    runtime: node
    plan: free
    region: oregon
    # Run the structure fixer FIRST in case the ZIP extracted into a nested folder,
    # then install deps, push the Drizzle schema, and build Next.js.
    buildCommand: node scripts/fix-structure.js && npm install && npx drizzle-kit push && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: adonai-db
          property: connectionString

databases:
  # PostgreSQL Database on Render
  - name: adonai-db
    plan: free
    region: oregon
    databaseName: app_db
    user: postgres
