name: Build AdonaiPOS APK

on:
  push:
    branches: [ "arena/01a0b946-adonai-thrift-store", "arena/01a0aaa3-adonai-thrift-store", "main" ]
    paths:
      - "AdonaiPOS/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AdonaiPOS/package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('AdonaiPOS/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK + NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lh $ANDROID_HOME 2>&1 | head -n 20
          # Ensure required platform + build-tools + NDK for RN 0.74 / Expo 51
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" 2>&1 | tail -n 20 || \
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" 2>&1 | tail -n 20
          yes | sdkmanager --licenses 2>&1 | tail -n 10 || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 | tail -n 10 || true
          echo "sdkmanager done"
          ls $ANDROID_HOME/build-tools 2>&1 | head -n 20
          ls $ANDROID_HOME/ndk 2>&1 | head -n 20

      - name: Install JS deps
        working-directory: AdonaiPOS
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild (regen android if needed)
        working-directory: AdonaiPOS
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x AdonaiPOS/android/gradlew

      - name: Build APK (release)
        working-directory: AdonaiPOS/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdonaiPOS-release-apk
          path: AdonaiPOS/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Summary
        run: |
          echo "### APK built ✅" >> $GITHUB_STEP_SUMMARY
          echo "Download artifact **AdonaiPOS-release-apk** from this run, then install on phone." >> $GITHUB_STEP_SUMMARY
          ls -lh AdonaiPOS/android/app/build/outputs/apk/release/ >> $GITHUB_STEP_SUMMARY
